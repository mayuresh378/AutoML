services:
  # Backend API (FastAPI + Uvicorn via Docker)
  - type: web
    name: automl-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false # Neon PostgreSQL Connection String (postgresql://user:password@ep-xxxx.neon.tech/automl?sslmode=require)
      - key: REDIS_URL
        sync: false # Production Redis Caching URL (e.g. rediss://... or redis://...)
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: 'https://automl-platform-1.onrender.com,https://automl-frontend.onrender.com,https://automl-api-ukq3.onrender.com'
      - key: TRUSTED_HOSTS
        value: '*.onrender.com,localhost,127.0.0.1'
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: "production"
    healthCheckPath: /api/v1/health
    autoDeploy: true

  # Frontend (React static site)
  - type: web
    name: automl-frontend
    runtime: static
    repo: https://github.com/mayuresh378/automl-platform
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://automl-api-ukq3.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

